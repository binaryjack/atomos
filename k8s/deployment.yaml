apiVersion: apps/v1
kind: Deployment
metadata:
  name: atomos-showcase
  labels:
    app: atomos-showcase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atomos-showcase
  template:
    metadata:
      labels:
        app: atomos-showcase
    spec:
      containers:
        - name: atomos-showcase
          image: atomos-showcase:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
